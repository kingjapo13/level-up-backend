# Render Blueprint – use Python 3.10 so MediaPipe works
# If you already have a Web Service: set PYTHON_VERSION=3.10.14 in Dashboard → Environment and redeploy.
services:
  - type: web
    name: level-up-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
